[platformio]
; PlatformIO 的 ESP-IDF 集成默认要求源码在 src/，这里指向 IDF 标准的 main/ 组件目录
src_dir = main

[env:esp32]
platform = espressif32
board = esp32dev
board_build.partitions = partitions.csv
framework = espidf
monitor_speed = 115200

; ESP32-S3 目标
[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
board_build.partitions = partitions.csv
framework = espidf
monitor_speed = 115200

; ESP32-C6 目标
[env:esp32c6]
platform = espressif32
board = esp32-c6-devkitc-1
board_build.partitions = partitions.csv
framework = espidf
monitor_speed = 115200

; ESP32-C3 目标
[env:esp32c3]
platform = espressif32
board = esp32-c3-devkitm-1
board_build.partitions = partitions.csv
framework = espidf
monitor_speed = 115200
