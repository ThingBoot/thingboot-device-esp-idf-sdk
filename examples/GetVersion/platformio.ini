[platformio]
; PlatformIO 的 ESP-IDF 集成默认要求源码在 src/，这里指向 IDF 标准的 main/ 组件目录
src_dir = main

; v1.16 起联网模块 addon 化：每芯片一个 env（addon TU 随组件全量编译），
; 打包时 base 库剔除 addon 对象、addon 对象单独归档 addon_net_<模块>_<芯片>.a。
; 注意：不要加 -DTBD_ETHER/-DTBD_GSM/-DTBD_BLE build_flags——
; 模块代码只由 src_addon/ 的 addon TU 编译，定义这些宏会导致与 addon TU 重复定义

[env:esp32]
platform = espressif32
board = esp32dev
board_build.partitions = partitions.csv
framework = espidf
monitor_speed = 115200

[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
board_build.partitions = partitions.csv
framework = espidf
monitor_speed = 115200

[env:esp32c6]
platform = espressif32
board = esp32-c6-devkitc-1
board_build.partitions = partitions.csv
framework = espidf
monitor_speed = 115200

[env:esp32c3]
platform = espressif32
board = esp32-c3-devkitm-1
board_build.partitions = partitions.csv
framework = espidf
monitor_speed = 115200
