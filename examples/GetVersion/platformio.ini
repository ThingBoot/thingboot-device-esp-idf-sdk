[platformio]
; PlatformIO 的 ESP-IDF 集成默认要求源码在 src/，这里指向 IDF 标准的 main/ 组件目录
src_dir = main

[env:esp32]
platform = espressif32
board = esp32dev
board_build.partitions = partitions.csv
framework = espidf
monitor_speed = 115200

; 以太网（W5500）变体：产出 libthingboot_device_esp32_ether.a
[env:esp32_ether]
platform = espressif32
board = esp32dev
board_build.partitions = partitions.csv
framework = espidf
monitor_speed = 115200
build_flags = -DTBD_ETHER

; GSM/4G（ML307）变体：产出 libthingboot_device_esp32_gsm.a
[env:esp32_gsm]
platform = espressif32
board = esp32dev
board_build.partitions = partitions.csv
framework = espidf
monitor_speed = 115200
build_flags = -DTBD_GSM

; BLE 配网变体：产出 libthingboot_device_esp32_ble.a
[env:esp32_ble]
platform = espressif32
board = esp32dev
board_build.partitions = partitions.csv
framework = espidf
monitor_speed = 115200
build_flags = -DTBD_BLE
board_build.sdkconfig =
    CONFIG_ETH_USE_SPI_ETHERNET=y
    CONFIG_ETH_SPI_ETHERNET_W5500=y

; ESP32-S3 目标：产出 libthingboot_device_esp32s3.a
[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
board_build.partitions = partitions.csv
framework = espidf
monitor_speed = 115200

; ESP32-C6 目标：产出 libthingboot_device_esp32c6.a
[env:esp32c6]
platform = espressif32
board = esp32-c6-devkitc-1
board_build.partitions = partitions.csv
framework = espidf
monitor_speed = 115200

; ESP32-C3 目标：产出 libthingboot_device_esp32c3.a
[env:esp32c3]
platform = espressif32
board = esp32-c3-devkitm-1
board_build.partitions = partitions.csv
framework = espidf
monitor_speed = 115200

